name: Release

on:
  push:
    tags: [ "v*.*.*" ]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v5

      - name: Build and unit-test
        run: ./gradlew assembleDebug testDebugUnitTest --console=plain

      - name: Name the APK
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cp app/build/outputs/apk/debug/app-debug.apk "SkyPython-${VERSION}.apk"
          sha256sum "SkyPython-${VERSION}.apk" > "SkyPython-${VERSION}.apk.sha256"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # Re-pushing a tag replaces its release.
          gh release delete "$GITHUB_REF_NAME" --yes 2>/dev/null || true
          gh release create "$GITHUB_REF_NAME" \
            "SkyPython-${VERSION}.apk" "SkyPython-${VERSION}.apk.sha256" \
            --title "SkyPython ${VERSION}" \
            --notes-file .github/release-notes/${GITHUB_REF_NAME}.md \
            --prerelease
