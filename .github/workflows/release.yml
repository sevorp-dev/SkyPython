name: Release

on:
  push:
    tags: [ "v*.*.*" ]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v5

      - name: Unit-test
        run: ./gradlew testDebugUnitTest --console=plain

      # One minified release APK per ABI (smallest download) plus a universal one with
      # every ABI from gradle.properties (skypython.abis). Per-ABI builds pass
      # -Pskypython.abis=<abi>, which also drops the other ABIs' stdlib zips from assets.
      - name: Build release APKs
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ABIS="$(sed -n 's/^skypython\.abis=//p' gradle.properties | tr -d ' ')"
          mkdir -p dist
          for ABI in ${ABIS//,/ }; do
            ./gradlew :app:assembleRelease -Pskypython.abis="$ABI" --console=plain
            cp app/build/outputs/apk/release/app-release.apk "dist/SkyPython-${VERSION}-${ABI}.apk"
          done
          ./gradlew :app:assembleRelease --console=plain
          cp app/build/outputs/apk/release/app-release.apk "dist/SkyPython-${VERSION}-universal.apk"
          cd dist && sha256sum *.apk > SHA256SUMS && cat SHA256SUMS && ls -l
          # The in-app updater downloads SkyPython-<version>-<abi|universal>.apk and looks its
          # name up in SHA256SUMS (app/.../update/Releases.kt): keep these names.
          for V in arm64-v8a armeabi-v7a x86 x86_64 universal; do
            grep -q "^[0-9a-f]\{64\}  SkyPython-${VERSION}-${V}\.apk$" SHA256SUMS \
              || { echo "SHA256SUMS lacks SkyPython-${VERSION}-${V}.apk"; exit 1; }
          done
          sha256sum -c SHA256SUMS

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # Re-pushing a tag replaces its release.
          gh release delete "$GITHUB_REF_NAME" --yes 2>/dev/null || true
          gh release create "$GITHUB_REF_NAME" dist/*.apk dist/SHA256SUMS \
            --title "SkyPython ${VERSION}" \
            --notes-file .github/release-notes/${GITHUB_REF_NAME}.md \
            --latest

      - name: Sync notes of every version, remove build-only releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Every app release is "SkyPython X.Y.Z" with its notes from .github/release-notes/.
          for f in .github/release-notes/v*.md; do
            tag="$(basename "$f" .md)"
            if gh release view "$tag" > /dev/null 2>&1; then
              gh release edit "$tag" --title "SkyPython ${tag#v}" --notes-file "$f" --prerelease=false
            fi
          done
          # CPython for 32-bit devices lives in the cpython-builds branch, not in Releases.
          # (grep exits 1 when nothing matches; that's fine.)
          { gh release list --limit 100 --json tagName --jq '.[].tagName' | grep '^python-android-' || true; } \
            | while read -r tag; do gh release delete "$tag" --yes --cleanup-tag; done
