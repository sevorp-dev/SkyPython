# Builds Android wheels with native code (NumPy, Pillow) for SkyPython (CPython 3.14,
# Android API level 24+) and publishes them on the orphan branch `wheels` of this repo:
#
#   https://raw.githubusercontent.com/<owner>/<repo>/wheels/index.json   (catalogue for the app)
#   https://raw.githubusercontent.com/<owner>/<repo>/wheels/<wheel file>
#
# The branch holds one wheel per project x ABI and is replaced by a single new commit on every
# publish (force push), so its history stays small. Wheels already published under the same
# file name are kept byte for byte (make_index.py). See docs/native-packages.md.
#
# 64-bit (arm64-v8a, x86_64): stock cibuildwheel (Android platform); the x86_64 wheels are
#   smoke-tested on an emulator.
# 32-bit (armeabi-v7a, x86): cibuildwheel does not support them, so it is patched
#   (.github/wheels/patch_cibw_32bit.py) to use our own CPython builds (branch cpython-builds,
#   from build-python.yml); no auditwheel. Allowed to fail: the 64-bit wheels are published
#   regardless. The x86 wheels are tested on an x86_64 emulator.
#
# NumPy: OpenBLAS from Chaquopy's `chaquopy-openblas` wheel on 64-bit, vendored into the wheel
#   by auditwheel together with libc++_shared; no BLAS and static libc++ on 32-bit.
# Pillow: libjpeg-turbo, libpng, FreeType, libwebp, libtiff and Little CMS built from source
#   (.github/wheels/build_pillow_deps.sh) and linked statically; zlib is Android's libz.so.
# pandas: built against this index's own NumPy wheel (its Android numpy headers via
#   cibuildwheel's xbuild-files; the host gets the same NumPy version from PyPI); C++ runtime
#   vendored by auditwheel on 64-bit, linked statically on 32-bit. Published with
#   requires = ["numpy"].
# kiwisolver, contourpy, matplotlib (C++): libc++_shared vendored by auditwheel on 64-bit,
#   libc++ linked statically on 32-bit. matplotlib builds its bundled FreeType, HarfBuzz,
#   libraqm, SheenBidi and Qhull (meson subprojects) statically. Packages with `requires`
#   (contourpy -> numpy; matplotlib -> numpy, pillow, kiwisolver, contourpy) are built and
#   tested against the wheels already published on `wheels`, so publish those first.
name: Build Android wheels

on:
  workflow_dispatch:
    inputs:
      packages:
        description: Packages to build (space-separated; numpy, pillow, pandas, kiwisolver, contourpy, matplotlib)
        required: true
        default: numpy pillow
      numpy_version:
        description: NumPy version (PyPI sdist)
        required: true
        default: 2.5.4
      pillow_version:
        description: Pillow version (PyPI sdist)
        required: true
        default: 13.0.0
      pandas_version:
        description: pandas version (PyPI sdist)
        required: true
        default: 3.1.0
      kiwisolver_version:
        description: kiwisolver version (PyPI sdist)
        required: true
        default: 1.5.1
      contourpy_version:
        description: ContourPy version (PyPI sdist)
        required: true
        default: 1.4.0
      matplotlib_version:
        description: Matplotlib version (PyPI sdist)
        required: true
        default: 3.11.2
      publish:
        description: Publish the wheels to the `wheels` branch
        type: boolean
        default: true
      replace:
        description: Overwrite already published wheels with the same file name (clients may see a stale index.json for a few minutes)
        type: boolean
        default: false
  # Pushing the branch `build-wheels` runs it with the defaults; "[skip publish]" in the
  # commit message builds and tests without publishing, "[packages: pandas]" (any list of
  # packages) builds only those. Matplotlib is tested against the PUBLISHED kiwisolver and
  # contourpy wheels, so publish those first ("[packages: kiwisolver contourpy]"), then matplotlib.
  push:
    branches: [ build-wheels ]
    paths:
      - .github/workflows/build-wheels.yml
      - .github/wheels/**

permissions:
  contents: read

concurrency:
  group: build-wheels

env:
  PACKAGES: ${{ inputs.packages || 'numpy pillow' }}
  NUMPY_VERSION: ${{ inputs.numpy_version || '2.5.4' }}
  PILLOW_VERSION: ${{ inputs.pillow_version || '13.0.0' }}
  PANDAS_VERSION: ${{ inputs.pandas_version || '3.1.0' }}
  KIWISOLVER_VERSION: ${{ inputs.kiwisolver_version || '1.5.1' }}
  CONTOURPY_VERSION: ${{ inputs.contourpy_version || '1.4.0' }}
  MATPLOTLIB_VERSION: ${{ inputs.matplotlib_version || '3.11.2' }}
  CIBW_VERSION: 4.3.4
  OPENBLAS_VERSION: 0.3.33
  # CPython for the 32-bit ABIs: our own build (build-python.yml), hashes pinned in
  # runtime/python.properties.
  PYVER: 3.14.9

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      packages: ${{ steps.plan.outputs.packages }}
      requires: ${{ steps.plan.outputs.requires }}
    steps:
      - id: plan
        run: |
          python3 - <<'PY'
          import json, os, re
          known = ["numpy", "pillow", "pandas", "kiwisolver", "contourpy", "matplotlib"]
          # Other packages of this index each one needs at runtime: written to index.json
          # ("requires"), and their published wheels are used to build and test it.
          requires = {
              "contourpy": ["numpy"],
              "matplotlib": ["numpy", "pillow", "kiwisolver", "contourpy"],
          }
          packages = os.environ["PACKAGES"]
          # On push, "[packages: a b]" in the commit message overrides the default list.
          m = re.search(r"\[packages?:\s*([^\]]+)\]", os.environ.get("HEAD_MSG") or "")
          if os.environ["GITHUB_EVENT_NAME"] == "push" and m:
              packages = m.group(1)
          wanted = [p.lower() for p in re.split(r"[\s,]+", packages) if p]
          bad = [p for p in wanted if p not in known]
          if bad or not wanted:
              raise SystemExit(f"::error::unknown packages {bad}; choose from {known}")
          abis = [
              # an ARM emulator cannot run on an x86_64 runner, so only x86 ABIs are tested
              {"abi": "arm64_v8a", "triplet": "aarch64-linux-android", "bits": 64, "test": False},
              {"abi": "x86_64", "triplet": "x86_64-linux-android", "bits": 64, "test": True},
              {"abi": "armeabi_v7a", "triplet": "arm-linux-androideabi", "bits": 32, "test": False},
              {"abi": "x86", "triplet": "i686-linux-android", "bits": 32, "test": True},
          ]
          include = [{"package": p, "deps": " ".join(requires.get(p, [])), **a}
                     for p in known if p in wanted for a in abis]
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"matrix={json.dumps({'include': include})}\n")
              f.write(f"packages={' '.join(p for p in known if p in wanted)}\n")
              f.write(f"requires={' '.join(p + '=' + ','.join(d) for p, d in requires.items())}\n")
          print(json.dumps(include, indent=1))
          PY
        env:
          HEAD_MSG: ${{ github.event.head_commit.message }}

  build:
    needs: plan
    name: ${{ matrix.package }} ${{ matrix.abi }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    continue-on-error: ${{ matrix.bits == 32 }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      PACKAGE: ${{ matrix.package }}
      ABI: ${{ matrix.abi }}
      TRIPLET: ${{ matrix.triplet }}
      BITS: ${{ matrix.bits }}
      RUN_TEST: ${{ matrix.test }}
      DEPS: ${{ matrix.deps }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      # cibuildwheel uses the runner's Android SDK (ANDROID_HOME) and installs the NDK
      # through sdkmanager, which needs Java.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Enable KVM (emulator test)
        if: matrix.test
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install cibuildwheel ${{ env.CIBW_VERSION }}
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/cibw"
          "$RUNNER_TEMP/cibw/bin/pip" install -q "cibuildwheel==$CIBW_VERSION"
          echo "$RUNNER_TEMP/cibw/bin" >> "$GITHUB_PATH"

      - name: Patch cibuildwheel for ${{ matrix.abi }} (32-bit)
        if: matrix.bits == 32
        run: |
          set -euo pipefail
          sha="$(grep -E "^sha256\.$TRIPLET=" runtime/python.properties | cut -d= -f2)"
          test -n "$sha" || { echo "::error::no sha256.$TRIPLET in runtime/python.properties"; exit 1; }
          pkg="$("$RUNNER_TEMP/cibw/bin/python" -c 'import cibuildwheel, os; print(os.path.dirname(cibuildwheel.__file__))')"
          python .github/wheels/patch_cibw_32bit.py "$pkg" --version "$PYVER" --abi "$ABI" \
            --url "https://raw.githubusercontent.com/${{ github.repository }}/cpython-builds/python-$PYVER-$TRIPLET.tar.gz" \
            --sha256 "$sha"

      - name: Download the ${{ matrix.package }} sdist
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, os, urllib.request
          p = os.environ["PACKAGE"]
          v = os.environ[p.upper() + "_VERSION"]
          meta = json.load(urllib.request.urlopen(f"https://pypi.org/pypi/{p}/{v}/json"))
          sdist = next(u for u in meta["urls"] if u["packagetype"] == "sdist")
          data = urllib.request.urlopen(sdist["url"]).read()
          assert hashlib.sha256(data).hexdigest() == sdist["digests"]["sha256"], "sdist hash mismatch"
          open("sdist.tar.gz", "wb").write(data)
          print(sdist["filename"], len(data), sdist["digests"]["sha256"])
          PY
          mkdir src
          tar -xzf sdist.tar.gz -C src --strip-components=1

      # The wheels of this index the package needs (matrix.deps) come from the `wheels`
      # branch, for this ABI: pip finds them there (PIP_FIND_LINKS) when installing the
      # test environment; pure-Python dependencies still come from PyPI.
      - name: Fetch the published wheels it needs (${{ matrix.deps }})
        if: matrix.deps != ''
        run: |
          set -euo pipefail
          git fetch -q --depth=1 origin wheels
          mkdir -p "$RUNNER_TEMP/deps"
          for dep in $DEPS; do
            files="$(git ls-tree --name-only FETCH_HEAD | grep -E "^${dep}-[^-]+-.*-android_[0-9]+_${ABI}\.whl$" || true)"
            if [ -z "$files" ]; then
              # Still build and verify the wheel, untested; the leg fails before uploading it.
              echo "::warning::no published $dep wheel for $ABI on branch wheels; publish $dep first"
              echo "DEPS_MISSING=${DEPS_MISSING:-}${DEPS_MISSING:+ }$dep" >> "$GITHUB_ENV"
              DEPS_MISSING="${DEPS_MISSING:-}${DEPS_MISSING:+ }$dep"
              continue
            fi
            for f in $files; do
              git cat-file blob "FETCH_HEAD:$f" > "$RUNNER_TEMP/deps/$f"
            done
          done
          (cd "$RUNNER_TEMP/deps" && sha256sum *.whl) || true
          echo "::notice title=Dependencies $ABI::$(cd "$RUNNER_TEMP/deps" && ls | tr '\n' ' ')"

      # Static libc++ on 32-bit, where auditwheel cannot vendor libc++_shared (see numpy).
      - name: Link libc++ statically (kiwisolver, 32-bit)
        if: matrix.package == 'kiwisolver' && matrix.bits == 32
        run: |
          set -euo pipefail
          sed -i 's/        language="c++",/        language="c++",\n        extra_link_args=["-static-libstdc++"],/' src/setup.py
          grep -n 'extra_link_args=\["-static-libstdc++"\]' src/setup.py

      # NumPy's build runs a test program to find the long double format, which is impossible
      # when cross-compiling. Android: 128-bit quad on 64-bit ABIs (also x86_64), plain double
      # on 32-bit. NumPy main (2.6.0) hardcodes the same for Android (numpy/numpy#30412).
      - name: Set the long double format (numpy)
        if: matrix.package == 'numpy'
        run: |
          set -euo pipefail
          if [ "$BITS" = 64 ]; then fmt=IEEE_QUAD_LE; else fmt=IEEE_DOUBLE_LE; fi
          f=src/numpy/_core/meson.build
          sed -i "s/meson.get_external_property('longdouble_format', 'UNKNOWN')/'$fmt'/" "$f"
          grep -n "longdouble_format = '$fmt'" "$f"

      - name: Fetch OpenBLAS ${{ env.OPENBLAS_VERSION }} for Android (numpy, 64-bit)
        if: matrix.package == 'numpy' && matrix.bits == 64
        run: |
          set -euo pipefail
          pip download "chaquopy-openblas==$OPENBLAS_VERSION" --no-deps --only-binary=:all: \
            --index-url https://chaquo.com/pypi-upstream/ --platform "android_24_$ABI" -d openblas-dl
          mkdir -p "$RUNNER_TEMP/openblas"
          unzip -q openblas-dl/*.whl -d "$RUNNER_TEMP/openblas"
          test -f "$RUNNER_TEMP/openblas/chaquopy/lib/pkgconfig/openblas.pc"
          cp "$RUNNER_TEMP"/openblas/chaquopy_openblas-*.dist-info/LICENSE "$RUNNER_TEMP/OpenBLAS-LICENSE.txt"
          echo "::notice title=OpenBLAS $ABI::$(ls openblas-dl) sha256 $(sha256sum openblas-dl/*.whl | cut -d' ' -f1)"

      # libjpeg-turbo's x86 SIMD code is assembled with NASM. The libraries themselves are
      # built by build_pillow_deps.sh as cibuildwheel's before-build (it needs the NDK
      # environment cibuildwheel sets up).
      - name: Prepare the Pillow dependency build (pillow)
        if: matrix.package == 'pillow'
        run: |
          set -euo pipefail
          sudo apt-get install -y -q nasm > /dev/null
          nasm -v
          mkdir -p "$RUNNER_TEMP/pillow-deps"

      # pandas compiles against NumPy's headers. The build machine gets NumPy from PyPI (the
      # version this index publishes, pinned with PIP_CONSTRAINT); cibuildwheel's default
      # xbuild-files then copy the target's _numpyconfig.h etc. from the Android wheel, which
      # pip finds in PIP_FIND_LINKS: our own published wheel for this ABI. The emulator test
      # installs the same wheel (python-dateutil and six come from PyPI).
      - name: Fetch this index's NumPy wheel (pandas)
        if: matrix.package == 'pandas'
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, os, urllib.request
          base = "https://raw.githubusercontent.com/${{ github.repository }}/wheels/"
          abi = {"arm64_v8a": "arm64-v8a", "armeabi_v7a": "armeabi-v7a"}.get(os.environ["ABI"], os.environ["ABI"])
          index = json.load(urllib.request.urlopen(base + "index.json"))
          e = next(e for e in index["packages"]["numpy"] if e["abi"] == abi)
          data = urllib.request.urlopen(base + e["file"]).read()
          assert hashlib.sha256(data).hexdigest() == e["sha256"], "numpy wheel hash mismatch"
          d = os.path.join(os.environ["RUNNER_TEMP"], "numpy-wheels")
          os.makedirs(d, exist_ok=True)
          open(os.path.join(d, e["file"]), "wb").write(data)
          open(os.path.join(os.environ["RUNNER_TEMP"], "numpy-constraint.txt"), "w").write(f"numpy=={e['version']}\n")
          print(f"::notice title=numpy for pandas {abi}::{e['file']} sha256 {e['sha256']}")
          PY

      # Our own cibuildwheel config (replaces the one in the package's pyproject.toml).
      - name: Write the cibuildwheel config
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          tmp, bits, test = os.environ["RUNNER_TEMP"], os.environ["BITS"], os.environ["RUN_TEST"]
          package = os.environ["PACKAGE"]
          q = json.dumps  # TOML basic strings are compatible with JSON strings
          before_build = ""
          if package == "numpy":
              if bits == "64":
                  lib = f"{tmp}/openblas/chaquopy/lib"
                  setup_args = ["-Duse-ilp64=false", "-Dallow-noblas=false",
                                "-Dblas=openblas", "-Dlapack=openblas"]
                  env = {"PKG_CONFIG_PATH": f"{lib}/pkgconfig", "AUDITWHEEL_LD_LIBRARY_PATH": lib}
                  # cibuildwheel's default plus the OpenBLAS directory: vendors libc++_shared
                  # and libopenblas into the wheel.
                  repair = "auditwheel repair --ldpaths {ldpaths}:%s -w {dest_dir} {wheel}" % lib
              else:
                  # No BLAS (lapack_lite), static libc++: auditwheel does not know 32-bit
                  # Android. Setting cpp_link_args makes meson ignore $LDFLAGS for C++
                  # targets, so repeat the flags from CPython's android-env.sh (16 KB pages
                  # above all).
                  cpp_link = ["-static-libstdc++", "-Wl,--build-id=sha1", "-Wl,--no-rosegment",
                              "-Wl,-z,max-page-size=16384", "-Wl,--no-undefined", "-lm"]
                  setup_args = ["-Dallow-noblas=true", "-Dblas=none", "-Dlapack=none",
                                "-Dcpp_link_args=" + repr(cpp_link)]
                  # Clear setup-python's PKG_CONFIG_PATH, or meson finds the runner's
                  # python3.pc instead of the target's.
                  env = {"PKG_CONFIG_PATH": ""}
                  repair = ""
              config_settings = "{ setup-args = %s, build-dir = \"build\" }" % json.dumps(setup_args)
              smoke = ("import numpy; print('SMOKE', numpy.__version__, numpy.arange(10).sum(), "
                       "numpy.linalg.inv([[1,2],[3,4]])); numpy.show_config()")
          elif package == "pandas":
              env = {"PIP_FIND_LINKS": f"{tmp}/numpy-wheels",
                     "PIP_CONSTRAINT": f"{tmp}/numpy-constraint.txt",
                     # not setup-python's (the runner's python3.pc instead of the target's)
                     "PKG_CONFIG_PATH": ""}
              if bits == "64":
                  # cibuildwheel's default: vendors libc++_shared into pandas.libs/.
                  setup_args = []
                  repair = "auditwheel repair --ldpaths {ldpaths} -w {dest_dir} {wheel}"
              else:
                  # auditwheel does not know 32-bit Android: static libc++, with the 16 KB
                  # page flags repeated (cpp_link_args replaces $LDFLAGS for C++ targets).
                  cpp_link = ["-static-libstdc++", "-Wl,--build-id=sha1", "-Wl,--no-rosegment",
                              "-Wl,-z,max-page-size=16384", "-Wl,--no-undefined", "-lm"]
                  setup_args = ["-Dcpp_link_args=" + repr(cpp_link)]
                  repair = ""
              config_settings = "{ setup-args = %s, build-dir = \"build\" }" % json.dumps(setup_args)
              smoke = (
                  "import pandas as pd, numpy as np, io; "
                  "df = pd.DataFrame({'city': ['Oslo', 'Rome', 'Oslo'], 't': [3.5, 18.2, 4.1]}); "
                  "print('SMOKE', pd.__version__, np.__version__, df.groupby('city').t.mean().round(2).to_dict()); "
                  "print('SMOKE', pd.read_csv(io.StringIO('a,b\\n1,2\\n3,4')).sum().to_dict(), "
                  "pd.Timestamp('2026-10-26').day_name(), "
                  "pd.Series([1.0, 2.0, 3.0, 4.0]).rolling(2).mean().tolist(), "
                  "pd.to_datetime(['2026-01-31', '2026-02-28']).month.tolist())"
              )
          elif package == "pillow":
              deps = f"{tmp}/pillow-deps"
              before_build = f"bash {os.environ['GITHUB_WORKSPACE']}/.github/wheels/build_pillow_deps.sh"
              env = {"PILLOW_DEPS": deps, "PKG_CONFIG_PATH": ""}
              # setup.py looks for every library in <ROOT>/lib and <ROOT>/include.
              for root in ("ZLIB", "JPEG", "FREETYPE", "WEBP", "TIFF", "LCMS"):
                  env[f"{root}_ROOT"] = deps
              # Everything is linked statically (libz is a system library): nothing to vendor.
              repair = ""
              settings = {"platform-guessing": "disable", "zlib": "enable", "jpeg": "enable",
                          "freetype": "enable", "webp": "enable", "tiff": "enable",
                          "lcms": "enable", "raqm": "disable", "imagequant": "disable",
                          "jpeg2000": "disable", "avif": "disable", "xcb": "disable"}
              config_settings = "{ %s }" % ", ".join(f"{q(k)} = {q(v)}" for k, v in settings.items())
              checks = ["jpg", "zlib", "freetype2", "webp", "libtiff", "littlecms2"]
              smoke = (
                  "from PIL import Image, ImageDraw, ImageFont, ImageCms, features; "
                  "im=Image.new('RGB',(64,64),'orange'); d=ImageDraw.Draw(im); "
                  "d.text((4,4),'Sky',fill='black'); d.text((4,24),'Sky',fill='black',font=ImageFont.load_default(20)); "
                  "[im.save('t.'+e) for e in ('png','jpg','webp','tif')]; "
                  "print('SMOKE', Image.__version__, " + ", ".join(f"features.check('{c}')" for c in checks) + "); "
                  "print('SMOKE', [Image.open('t.'+e).size for e in ('png','jpg','webp','tif')], "
                  "ImageCms.createProfile('sRGB') is not None, features.version('jpg'), "
                  "features.version('freetype2'), features.version('webp'), features.version('libtiff'), "
                  "features.version('littlecms2')); "
                  "assert all(features.check(c) for c in " + repr(checks) + ")"
              )
          else:  # kiwisolver, contourpy, matplotlib: C++ (pybind11 / cppy)
              # Clear setup-python's PKG_CONFIG_PATH (see numpy 32-bit).
              env = {"PKG_CONFIG_PATH": ""}
              if bits == "64":
                  # cibuildwheel's default: vendors libc++_shared into <package>.libs/.
                  repair = "auditwheel repair --ldpaths {ldpaths} -w {dest_dir} {wheel}"
              else:
                  # Static libc++ (kiwisolver: setup.py patched above); the 16 KB-page link
                  # flags of android-env.sh repeated, as cpp_link_args replaces $LDFLAGS.
                  repair = ""
              setup_args = []
              if package == "contourpy":
                  setup_args.append("-Dwerror=false")  # the NDK's clang may warn differently
              if bits == "32" and package != "kiwisolver":
                  setup_args.append("-Dcpp_link_args=" + repr(
                      ["-static-libstdc++", "-Wl,--build-id=sha1", "-Wl,--no-rosegment",
                       "-Wl,-z,max-page-size=16384", "-Wl,--no-undefined", "-lm"]))
              config_settings = ("{ setup-args = %s }" % json.dumps(setup_args)) if setup_args else "{}"
              if package == "kiwisolver":
                  smoke = (
                      "import kiwisolver as k, unittest; x=k.Variable('x'); y=k.Variable('y'); "
                      "s=k.Solver(); c=(x+y==10); s.addConstraint(c); s.addConstraint(x-y==2); "
                      "s.updateVariables(); "
                      "unittest.TestCase().assertRaises(k.DuplicateConstraint, s.addConstraint, c); "
                      "print('SMOKE', k.__version__, x.value(), y.value()); "
                      "assert (round(x.value(), 6), round(y.value(), 6)) == (6.0, 4.0)"
                  )
              elif package == "contourpy":
                  smoke = (
                      "import contourpy, numpy as np; z=np.random.rand(40,40); "
                      "g=contourpy.contour_generator(z=z); l=g.lines(0.5); f=g.filled(0.2,0.6); "
                      "t=contourpy.contour_generator(z=z, name='threaded', chunk_count=4, thread_count=2); "
                      "tf=t.filled(0.2,0.6); "
                      "print('SMOKE', contourpy.__version__, np.__version__, np.__file__, "
                      "len(l[0]), len(f[0]), len(tf[0]), t.thread_count)"
                  )
              else:  # matplotlib
                  smoke = (
                      "import matplotlib; matplotlib.use('Agg'); "
                      "import matplotlib.pyplot as plt, numpy as np; "
                      "x=np.linspace(0,6.28,200); fig,ax=plt.subplots(); ax.plot(x,np.sin(x),label='sin'); "
                      "ax.contourf(*np.meshgrid(x[:20],x[:20]), np.random.rand(20,20)); ax.legend(); "
                      "ax.set_title('SkyPython'); fig.savefig('t.png', dpi=100); "
                      "import kiwisolver, contourpy, PIL.Image; from matplotlib import ft2font; "
                      "print('SMOKE', matplotlib.__version__, kiwisolver.__version__, contourpy.__version__, "
                      "open('t.png','rb').read(8)); "
                      "print('SMOKE', 'numpy', np.__version__, 'pillow', PIL.__version__, "
                      "'freetype', ft2font.__freetype_version__, PIL.Image.open('t.png').size); "
                      "assert open('t.png','rb').read(8) == bytes.fromhex('89504e470d0a1a0a')"
                  )
          test_requires = os.environ["DEPS"].split()
          if test_requires:
              env["PIP_FIND_LINKS"] = f"{tmp}/deps"
          if os.environ.get("DEPS_MISSING"):
              test = "false"  # cannot install the test environment
          lines = [
              "[tool.cibuildwheel]",
              'build-frontend = "build"',
              f"before-build = {q(before_build)}",
              'before-test = ""',
              f"test-requires = {json.dumps(test_requires)}",
              f"test-command = {q('python -c ' + chr(34) + smoke + chr(34))}",
              f"test-skip = {q('' if test == 'true' else '*')}",
              "build-verbosity = 1",
              "",
              "[tool.cibuildwheel.android]",
              f"config-settings = {config_settings}",
              "environment = { %s }" % ", ".join(f"{k} = {q(v)}" for k, v in env.items()),
              f"repair-wheel-command = {q(repair)}",
          ]
          if os.environ["ABI"] == "x86":
              # The Gradle-managed emulator only accepts x86_64 APKs, so test on the emulator
              # started by android-emulator-runner (an x86_64 image that also runs x86 apps).
              lines.append('test-runtime = { args = ["--connected", "emulator-5554"] }')
          path = f"{tmp}/cibw.toml"
          open(path, "w").write("\n".join(lines) + "\n")
          print(open(path).read())
          import tomllib; tomllib.load(open(path, "rb"))  # fail early on a TOML mistake
          PY

      - name: Build (and test x86_64 on an emulator)
        if: matrix.abi != 'x86'
        id: build
        run: |
          set -o pipefail
          cibuildwheel src \
            --only "cp314-android_$ABI" \
            --config-file "$RUNNER_TEMP/cibw.toml" \
            --output-dir wheelhouse 2>&1 | tee build.log

      # cibuildwheel's Gradle-managed emulator only accepts x86_64 APKs; an x86_64 API 30
      # image also runs 32-bit x86 apps, so the x86 wheel is tested on this connected one.
      - name: Build and test x86 (on an x86_64 emulator)
        if: matrix.abi == 'x86'
        id: build_x86
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect
          script: bash -o pipefail -c 'echo "::notice title=x86 test emulator::abilist=$(adb shell getprop ro.product.cpu.abilist)"; cibuildwheel src --only "cp314-android_$ABI" --config-file "$RUNNER_TEMP/cibw.toml" --output-dir wheelhouse 2>&1 | tee build.log'

      - name: Report the build log tail
        if: always()
        run: |
          python - <<'PY'
          import os, re
          if not os.path.exists("build.log"):
              raise SystemExit
          lines = open("build.log", errors="replace").read().splitlines()
          kind = "notice" if os.environ["OUTCOME"] == "success" else "error"
          def emit(title, chunk):
              msg = "%0A".join(l[:300].replace("%", "%25").replace("\r", "") for l in chunk)
              print(f"::{kind} title={title}::{msg}")
          # The smoke test's output.
          for i, l in enumerate(lines):
              if "SMOKE" in l and "print(" not in l:
                  emit("smoke test", lines[i:i + 4])
                  break
          if os.environ["PACKAGE"] == "numpy":
              blas = [l for l in lines if re.search(r"openblas|lapack|blas", l, re.I)][-12:]
              if blas:
                  emit("BLAS lines", blas)
          elif os.environ["PACKAGE"] == "matplotlib":
              subs = [l for l in lines if re.search(r"Subproject |Downloading .* source|Executing subproject", l)][:12]
              if subs:
                  emit("matplotlib subprojects", subs)
          elif os.environ["PACKAGE"] == "pillow":
              for i, l in enumerate(lines):
                  if "PIL SETUP SUMMARY" in l:
                      emit("Pillow setup summary", lines[i:i + 20])
                      break
              simd = [l for l in lines if re.search(r"SIMD|NEON", l)][:8]
              if simd:
                  emit("libjpeg-turbo SIMD", simd)
          if kind == "error":
              errs = [l for l in lines if re.search(r"error|failed|FAILED|Traceback", l)][:40]
              if errs:
                  emit("error lines", errs)
              tail = lines[-150:]
              for k in range(0, len(tail), 50):
                  emit(f"log tail {k // 50 + 1}", tail[k:k + 50])
          PY
        env:
          OUTCOME: ${{ matrix.abi == 'x86' && steps.build_x86.outcome || steps.build.outcome }}

      - name: Add license texts, strip build-machine RUNPATHs
        run: |
          set -euo pipefail
          pip install -q patchelf
          libcxx=.github/wheels/licenses/libc++-LICENSE.txt
          lic=()
          if [ "$PACKAGE" = numpy ] && [ "$BITS" = 64 ]; then
            # libc++_shared and libopenblas are vendored by auditwheel.
            lic=(--license "libc++-LICENSE.txt=$libcxx@libc++_shared"
                 --license "OpenBLAS-LICENSE.txt=$RUNNER_TEMP/OpenBLAS-LICENSE.txt@libopenblas")
          elif [ "$PACKAGE" = numpy ]; then
            lic=(--license "libc++-LICENSE.txt=$libcxx")  # linked statically
          elif [ "$PACKAGE" = pandas ] && [ "$BITS" = 64 ]; then
            lic=(--license "libc++-LICENSE.txt=$libcxx@libc++_shared")  # vendored by auditwheel
          elif [ "$PACKAGE" = pandas ]; then
            lic=(--license "libc++-LICENSE.txt=$libcxx")  # linked statically
          elif [ "$PACKAGE" != pillow ]; then
            # kiwisolver, contourpy, matplotlib: libc++ is vendored (64-bit) or linked
            # statically (32-bit); the header-only C++ helpers they compile in are cppy /
            # pybind11. matplotlib's own license files already cover its bundled FreeType,
            # HarfBuzz, libraqm, SheenBidi and Agg, but not Qhull.
            lic=(--license "libc++-LICENSE.txt=$libcxx")
            case "$PACKAGE" in
              kiwisolver) lic+=(--license "cppy-LICENSE.txt=.github/wheels/licenses/cppy-LICENSE.txt") ;;
              *) lic+=(--license "pybind11-LICENSE.txt=.github/wheels/licenses/pybind11-LICENSE.txt") ;;
            esac
            if [ "$PACKAGE" = matplotlib ]; then
              qhull=(src/subprojects/qhull-*/COPYING.txt)
              [ -f "${qhull[0]}" ] || { echo "::error::Qhull's COPYING.txt not found in src/subprojects"; exit 1; }
              lic+=(--license "qhull-COPYING.txt=${qhull[0]}")
            fi
          else
            # Pillow: every library built by build_pillow_deps.sh is linked statically.
            files=("$RUNNER_TEMP"/pillow-deps/licenses/*)
            [ ${#files[@]} -eq 9 ] || { echo "::error::expected 9 Pillow dependency licenses, got: ${files[*]}"; exit 1; }
            for f in "${files[@]}"; do
              lic+=(--license "$(basename "$f")=$f")
            done
          fi
          python .github/wheels/finish_wheels.py wheelhouse/*.whl "${lic[@]}" 2>&1 | tee finish.log ||
            { echo "::error title=finish_wheels::$(tail -20 finish.log | sed ':a;N;$!ba;s/\n/%0A/g')"; exit 1; }
          python - wheelhouse/*.whl <<'PY'
          import sys, zipfile
          for w in sys.argv[1:]:
              names = [n.split(".dist-info/", 1)[1] for n in zipfile.ZipFile(w).namelist()
                       if any(f".dist-info/{s}" in n.lower() for s in ("licen", "copying"))]
              print(f"::notice title=Licenses in {w.split('/')[-1]}::" + " ".join(names))
          PY

      - name: Verify the wheel (tag, ELF machine, 16 KB alignment, dependencies)
        run: python .github/wheels/verify_wheels.py --max-api 24 --python-tag cp314 wheelhouse/*.whl

      - name: Refuse an untested wheel (dependencies not published)
        if: env.DEPS_MISSING != ''
        run: |
          echo "::error::built and verified, but not tested and not uploaded: publish $DEPS_MISSING first"
          exit 1

      - uses: actions/upload-artifact@v5
        with:
          name: wheels-${{ matrix.package }}-${{ matrix.abi }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    needs: [ plan, build ]
    # 32-bit legs may fail (continue-on-error), and then `needs.build.result` is still
    # "failure", so it is not checked here: the step below publishes a package only if both
    # of its 64-bit wheels were built.
    # (`inputs.publish != false` would be false on push: null == false in expressions.)
    if: >-
      ${{ !cancelled() && needs.plan.result == 'success' && (inputs.publish ||
      (github.event_name == 'push' && !contains(github.event.head_commit.message, '[skip publish]'))) }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v5
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true

      - name: Publish to branch `wheels`
        run: |
          set -euo pipefail
          shopt -s nullglob
          # A package is published only with both 64-bit wheels; 32-bit ones are optional.
          wheels=()
          incomplete=()
          for pkg in $BUILT; do
            ok=true
            for abi in arm64_v8a x86_64; do
              found=(dist/"$pkg"-*"_$abi.whl")
              [ ${#found[@]} -gt 0 ] || { echo "::error::no $pkg $abi wheel; $pkg is not published"; ok=false; }
            done
            if $ok; then wheels+=(dist/"$pkg"-*.whl); else incomplete+=("$pkg"); fi
          done
          [ ${#wheels[@]} -gt 0 ] || { echo "::error::no complete package was built"; exit 1; }
          python .github/wheels/verify_wheels.py --max-api 24 --python-tag cp314 "${wheels[@]}" > /dev/null

          # Start from what is published now (wheels of other ABIs/projects are kept).
          mkdir site
          if git ls-remote --exit-code --heads origin wheels > /dev/null; then
            git fetch --depth=1 origin wheels
            git archive FETCH_HEAD | tar -x -C site
          fi
          before="$(cat site/index.json site/README.md 2>/dev/null | sha256sum)"
          replace=()
          [ "$REPLACE" = true ] && replace=(--replace)
          requires=()
          for r in $REQUIRES; do requires+=(--requires "$r"); done
          # The index is rewritten from every published wheel, so list all `requires` here.
          python .github/wheels/make_index.py --site site "${replace[@]}" "${requires[@]}" \
            --requires pandas=numpy "${wheels[@]}"

          repo="${GITHUB_REPOSITORY}"
          {
            echo "# Android wheels for SkyPython"
            echo
            echo "Python packages with native code, built for SkyPython's CPython 3.14 on Android"
            echo "(API level 24+). Generated by \`.github/workflows/build-wheels.yml\` on \`main\`;"
            echo "this branch is replaced by a single new commit on every publish. Do not edit by hand."
            echo
            echo "- \`index.json\` — catalogue read by the app: for every project, one entry per ABI"
            echo "  (\`arm64-v8a\`, \`x86_64\`, \`armeabi-v7a\`, \`x86\`) with the file name, version, SHA-256,"
            echo "  size and \`requires\` (other projects of this index needed at runtime)."
            echo "- \`SHA256SUMS\` — checksums of the wheel files."
            echo "- \`*.whl\` — the wheels, downloadable at"
            echo "  \`https://raw.githubusercontent.com/$repo/wheels/<file>\`."
            echo
            echo "## Wheels"
            echo
            echo "| File | Size | SHA-256 |"
            echo "|---|---|---|"
            for w in site/*.whl; do
              echo "| \`$(basename "$w")\` | $(stat -c %s "$w") | \`$(sha256sum "$w" | cut -d' ' -f1)\` |"
            done
            echo
            echo "## Licenses"
            echo
            echo "Each wheel carries the license texts of everything it contains in"
            echo "\`*.dist-info/licenses/\` (or \`*.dist-info/LICENSE*\`)."
            echo
            echo "### numpy"
            echo
            echo "- **NumPy** — BSD-3-Clause, plus the permissively licensed components listed in its"
            echo "  \`LICENSE.txt\` (https://github.com/numpy/numpy)."
            echo "- **OpenBLAS** (64-bit numpy wheels, vendored as \`numpy.libs/libopenblas-*.so\`) —"
            echo "  BSD-3-Clause (https://github.com/OpenMathLib/OpenBLAS), binary from Chaquopy's"
            echo "  \`chaquopy-openblas\` (MIT packaging): \`OpenBLAS-LICENSE.txt\`."
            echo "- **LLVM libc++** (vendored as \`numpy.libs/libc++_shared-*.so\` on 64-bit, linked"
            echo "  statically on 32-bit) — Apache-2.0 WITH LLVM-exception: \`libc++-LICENSE.txt\`."
            echo
            echo "### pillow"
            echo
            echo "Pillow's extension modules link these libraries statically (built from source by"
            echo "\`.github/wheels/build_pillow_deps.sh\`); zlib is Android's system \`libz.so\`."
            echo
            echo "- **Pillow** — MIT-CMU (https://github.com/python-pillow/Pillow): \`LICENSE\`."
            echo "- **libjpeg-turbo** — IJG License, BSD-3-Clause and zlib License"
            echo "  (https://libjpeg-turbo.org): \`libjpeg-turbo-LICENSE.md\`,"
            echo "  \`libjpeg-turbo-README.ijg.txt\`. This software is based in part on the work of the"
            echo "  Independent JPEG Group."
            echo "- **libpng** — PNG Reference Library License version 2 (http://www.libpng.org):"
            echo "  \`libpng-LICENSE.txt\`."
            echo "- **FreeType** — used under the FreeType License (FTL) (https://freetype.org):"
            echo "  \`freetype-LICENSE.txt\`, \`freetype-FTL.txt\`. Portions of this software are"
            echo "  copyright © The FreeType Project (www.freetype.org). All rights reserved."
            echo "- **libwebp** — BSD-3-Clause and Google's patent grant"
            echo "  (https://chromium.googlesource.com/webm/libwebp): \`libwebp-COPYING.txt\`,"
            echo "  \`libwebp-PATENTS.txt\`."
            echo "- **libtiff** — libtiff License (https://libtiff.gitlab.io/libtiff/):"
            echo "  \`libtiff-LICENSE.md\`."
            echo "- **Little CMS 2** — MIT (https://www.littlecms.com): \`lcms2-LICENSE.txt\`."
            echo
            echo "### pandas"
            echo
            echo "Needs this index's \`numpy\` (\`requires\`); python-dateutil and six come from PyPI."
            echo
            echo "- **pandas** — BSD-3-Clause (https://github.com/pandas-dev/pandas): \`LICENSE\`,"
            echo "  plus the bundled code listed in its \`LICENSES/\` (klib, ultrajson, musl, xsimd,"
            echo "  fast_float, NumPy datetime code and others), all in \`*.dist-info/licenses/\`."
            echo "- **LLVM libc++** (vendored as \`pandas.libs/libc++_shared-*.so\` on 64-bit, linked"
            echo "  statically on 32-bit) — Apache-2.0 WITH LLVM-exception: \`libc++-LICENSE.txt\`."
            echo
            echo "### kiwisolver, contourpy, matplotlib"
            echo
            echo "- **LLVM libc++** (vendored as \`<package>.libs/libc++_shared-*.so\` on 64-bit, linked"
            echo "  statically on 32-bit) — Apache-2.0 WITH LLVM-exception: \`libc++-LICENSE.txt\`."
            echo "- **kiwisolver** — BSD-3-Clause (https://github.com/nucleic/kiwi): \`LICENSE\`; it"
            echo "  compiles in the header-only **cppy** — BSD-3-Clause: \`cppy-LICENSE.txt\`."
            echo "- **ContourPy** — BSD-3-Clause (https://github.com/contourpy/contourpy): \`LICENSE\`."
            echo "- **pybind11** (header-only, compiled into contourpy and matplotlib) — BSD-3-Clause"
            echo "  (https://github.com/pybind/pybind11): \`pybind11-LICENSE.txt\`."
            echo "- **Matplotlib** — PSF-based Matplotlib License, with fonts and bundled code under"
            echo "  their own licenses (https://matplotlib.org): \`LICENSE/LICENSE\` and the other"
            echo "  \`LICENSE/LICENSE_*\` files, \`extern/agg24-svn/src/copying\` (Anti-Grain Geometry)."
            echo "  Its extension modules link statically the copies it builds itself:"
            echo "  **FreeType** (FreeType License: \`LICENSE/LICENSE_FREETYPE\`; portions of this software"
            echo "  are copyright © The FreeType Project (www.freetype.org), all rights reserved),"
            echo "  **HarfBuzz** (Old MIT: \`LICENSE/LICENSE_HARFBUZZ\`), **libraqm** (MIT:"
            echo "  \`LICENSE/LICENSE_LIBRAQM\`), **SheenBidi** (Apache-2.0: \`LICENSE/LICENSE_SHEENBIDI\`)"
            echo "  and **Qhull** (Qhull License, http://www.qhull.org: \`qhull-COPYING.txt\`)."
          } > site/README.md

          if [ "$(cat site/index.json site/README.md | sha256sum)" = "$before" ]; then
            echo "::notice title=Published::nothing new; the wheels branch is unchanged"
          else
            cd site
            git init -q -b wheels
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -q -m "Android wheels: $(ls *.whl | tr '\n' ' ')"
            git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:wheels
            echo "::notice title=Published::$(ls *.whl | tr '\n' ' ')"
            python -c "import json; print('::notice title=index.json::' + json.dumps(json.load(open('index.json')), separators=(',', ':')))"
            {
              echo "### Android wheels"
              echo '```'
              cat SHA256SUMS
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ ${#incomplete[@]} -gt 0 ]; then
            echo "::error::not published (64-bit wheels missing): ${incomplete[*]}"
            exit 1
          fi
        env:
          BUILT: ${{ needs.plan.outputs.packages }}
          REQUIRES: ${{ needs.plan.outputs.requires }}
          GH_TOKEN: ${{ github.token }}
          REPLACE: ${{ inputs.replace || false }}
