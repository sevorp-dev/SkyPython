# Builds CPython for the 32-bit Android ABIs (python.org publishes only 64-bit builds)
# with CPython's own Android/android.py, and stores the tarballs in the
# `cpython-builds` branch of this repo. runtime/build.gradle.kts downloads them from
# there, checked against the hashes pinned in runtime/python.properties: paste the
# `sha256.*=` lines this workflow prints (job summary / annotations) into that file.
name: Build Python for Android (32-bit)

on:
  workflow_dispatch:
    inputs:
      python_version:
        description: CPython version (python/cpython must have the tag v<version>)
        required: true
        default: 3.14.9
      replace:
        description: Replace tarballs already in the release (breaks pinned hashes!)
        type: boolean
        default: false
  # Pushing the branch `build-python` runs it with the defaults (no GitHub UI or token needed).
  push:
    branches: [ build-python ]

permissions:
  contents: read

concurrency:
  group: build-python-${{ inputs.python_version || '3.14.9' }}

env:
  PYVER: ${{ inputs.python_version || '3.14.9' }}

jobs:
  build:
    name: Build ${{ matrix.host }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: arm-linux-androideabi
            readelf_machine: ARM
          - host: i686-linux-android
            readelf_machine: Intel 80386
    env:
      HOST: ${{ matrix.host }}
    steps:
      - name: Check version input
        run: |
          if ! [[ "$PYVER" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::python_version must look like 3.14.9, got '$PYVER'"
            exit 1
          fi

      - name: Check out CPython v${{ inputs.python_version || '3.14.9' }}
        uses: actions/checkout@v5
        with:
          repository: python/cpython
          ref: v${{ inputs.python_version || '3.14.9' }}
          path: cpython
          persist-credentials: false

      # sdkmanager (used by android-env.sh to install the NDK) needs Java.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      # `android.py build HOST` builds only the host; the build Python must exist first.
      - name: Build the build Python
        working-directory: cpython
        run: ./Android/android.py build build

      - name: Build CPython for ${{ matrix.host }}
        working-directory: cpython
        run: ./Android/android.py build "$HOST"

      - name: Package
        working-directory: cpython
        run: ./Android/android.py package "$HOST"

      - name: Verify the package layout
        env:
          MACHINE: ${{ matrix.readelf_machine }}
        run: |
          set -euo pipefail
          SHORT="${PYVER%.*}"
          TARBALL="cpython/cross-build/$HOST/dist/python-$PYVER-$HOST.tar.gz"
          test -f "$TARBALL" || { echo "::error::$TARBALL not produced"; ls -l "cpython/cross-build/$HOST/dist" || true; exit 1; }
          mkdir -p check dist
          tar -xzf "$TARBALL" -C check
          for f in \
            "prefix/lib/libpython$SHORT.so" \
            prefix/lib/libssl_python.so \
            prefix/lib/libcrypto_python.so \
            prefix/lib/libsqlite3_python.so \
            "prefix/include/python$SHORT/Python.h" \
            "prefix/lib/python$SHORT/os.py" \
            "prefix/lib/python$SHORT/_sysconfigdata__android_$HOST.py"; do
            test -f "check/$f" || { echo "::error::missing $f in $TARBALL"; exit 1; }
          done
          ls "check/prefix/lib/python$SHORT/lib-dynload/"*.so > /dev/null
          header="$(readelf -h "check/prefix/lib/libpython$SHORT.so")"
          echo "$header"
          grep -Eq 'Class:[[:space:]]+ELF32' <<< "$header" || { echo "::error::libpython is not ELF32"; exit 1; }
          grep -Eq "Machine:[[:space:]]+$MACHINE" <<< "$header" || { echo "::error::libpython is not $MACHINE"; exit 1; }
          cp "$TARBALL" dist/

      - uses: actions/upload-artifact@v5
        with:
          name: python-${{ inputs.python_version || '3.14.9' }}-${{ matrix.host }}
          path: dist/python-${{ inputs.python_version || '3.14.9' }}-${{ matrix.host }}.tar.gz
          if-no-files-found: error
          compression-level: 0

  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      REPLACE: ${{ inputs.replace || false }}
    steps:
      - uses: actions/download-artifact@v5
        with:
          pattern: python-${{ inputs.python_version || '3.14.9' }}-*
          path: dist
          merge-multiple: true

      - name: Compute SHA-256
        working-directory: dist
        run: |
          set -euo pipefail
          sha256sum python-*.tar.gz | tee SHA256SUMS
          : > python.properties.txt
          while read -r hash file; do
            triple="${file#python-$PYVER-}"
            triple="${triple%.tar.gz}"
            echo "sha256.$triple=$hash" >> python.properties.txt
          done < SHA256SUMS
          {
            echo "### Paste into runtime/python.properties"
            echo '```properties'
            cat python.properties.txt
            echo '```'
            echo "Then add armeabi-v7a and x86 to \`skypython.abis\` in gradle.properties."
          } >> "$GITHUB_STEP_SUMMARY"
          while read -r line; do
            echo "::notice title=runtime/python.properties::$line"
          done < python.properties.txt

      - name: Store in the cpython-builds branch
        working-directory: dist
        run: |
          set -euo pipefail
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git clone --quiet --depth 1 --branch cpython-builds             "https://x-access-token:${GH_TOKEN}@github.com/${GH_REPO}.git" store
          if [ "$REPLACE" != "true" ]; then
            for f in python-*.tar.gz; do
              if [ -e "store/$f" ]; then
                echo "::error::cpython-builds already has $f. Builds are not bit-for-bit reproducible, so replacing it would break the hash pinned in runtime/python.properties. Re-run with 'replace' checked if you really mean it."
                exit 1
              fi
            done
          fi
          cp python-*.tar.gz store/
          cd store
          sha256sum python-*.tar.gz > SHA256SUMS
          git add -A
          git commit --quiet -m "CPython $PYVER for 32-bit Android"
          git push --quiet origin cpython-builds
