name: Android CI

on:
  push:
    branches: [ "**" ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v5

      - name: Build and unit-test
        run: ./gradlew assembleDebug testDebugUnitTest --console=plain

      # The editor's language server against the bundle the build just packed.
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Language server tests (desktop Python)
        run: python -m unittest discover -s runtime/src/test/python -v

      - uses: actions/upload-artifact@v5
        with:
          name: SkyPython-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

  instrumented:
    name: instrumented (API ${{ matrix.api-level }} ${{ matrix.arch }})
    runs-on: ubuntu-24.04
    strategy:
      # One failing Android version must not cancel the others.
      fail-fast: false
      matrix:
        # 24 = minSdk (Android 7.0), then Android 9, 11, 14 and 16.
        api-level: [24, 28, 30, 34, 36]
        arch: [x86_64]
        include:
          # 32-bit Python (our own CPython build) on a 32-bit x86 emulator.
          - api-level: 28
            arch: x86
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v5

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run instrumented tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: ${{ matrix.arch }}
          # google_apis x86_64 images exist for every level in the matrix.
          target: google_apis
          disable-animations: true
          # The default data partition is small: installing the APK with all four ABIs (~66 MB)
          # next to the test APK and Python's files failed now and then on API 24
          # ("Failed to install-write all apks").
          disk-size: 4096M
          # Only the emulator's own ABI (x86 or x86_64): a third of the APK to build and install.
          # Also kept in a file: the summary below quotes its end when no test ran.
          script: bash -o pipefail -c "./gradlew connectedDebugAndroidTest -Pskypython.abis=${{ matrix.arch }} --console=plain 2>&1 | tee instrumented.log"

      - name: Summarize instrumented tests
        if: always()
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          results = glob.glob('**/build/outputs/androidTest-results/connected/**/*.xml', recursive=True)
          if not results:
              # The emulator or Gradle stopped before any test ran: say where (logs need sign-in).
              try:
                  tail = ' | '.join(l.strip() for l in open('instrumented.log', errors='replace').read().splitlines()[-40:] if l.strip())
                  detail = 'Gradle ended without results: ' + tail[-3000:]
              except FileNotFoundError:
                  detail = 'Gradle never started: the emulator setup failed'
              print(f"::error title=API ${{ matrix.api-level }} ${{ matrix.arch }} no test results::{detail.replace('%', '%25')}")
          for f in results:
              r = ET.parse(f).getroot()
              suites = [r] if r.tag == 'testsuite' else r.findall('testsuite')
              for s in suites:
                  print(f"::notice title=API ${{ matrix.api-level }} ${{ matrix.arch }} {s.get('name')}::tests={s.get('tests')} failures={s.get('failures')} errors={s.get('errors')} skipped={s.get('skipped')}")
                  # A run that crashed before any test leaves only system-err (with the crash logcat).
                  err = s.find('system-err')
                  if s.get('tests') == '0' and err is not None and (err.text or '').strip():
                      detail = ' '.join(err.text.split())[:3000].replace('%', '%25')
                      print(f"::error title=API ${{ matrix.api-level }} ${{ matrix.arch }} run crashed::{detail}")
                  for c in s.findall('testcase'):
                      bad = c.find('failure') if c.find('failure') is not None else c.find('error')
                      if bad is not None:
                          detail = ' '.join((bad.text or bad.get('message') or '').split())[:1500].replace('%', '%25')
                          print(f"::error title=Failure detail {c.get('name')}::{detail}")
                          print(f"::error title=API ${{ matrix.api-level }} ${{ matrix.arch }} FAILED {c.get('classname')}.{c.get('name')}::failed")
          PY

      # Step logs need a sign-in: when the emulator could not even be set up, put what the SDK
      # tools say (and the free disk space) into annotations.
      - name: Explain an emulator setup failure
        if: failure() && hashFiles('instrumented.log') == ''
        run: |
          sdk="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          echo "::error title=disk::$(df -h / "$sdk" | tail -n +2 | tr '\n' ' ')"
          echo "::error title=installed::$("$sdk/cmdline-tools/latest/bin/sdkmanager" --list_installed 2>&1 | grep -E 'system-images|emulator|platform-tools' | tr -s ' ' | tr '\n' ';' | cut -c1-2000)"
          out=$(yes | "$sdk/cmdline-tools/latest/bin/sdkmanager" --install "system-images;android-${{ matrix.api-level }};google_apis;${{ matrix.arch }}" emulator platform-tools 2>&1 | grep -v '^\[' | tail -20 | tr '\n' ';')
          echo "::error title=sdkmanager install::${out:0:3000}"
          ls ~/.android/avd 2>&1 | tr '\n' ' ' | sed 's/^/::error title=avd::/'

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: instrumented-test-reports-api${{ matrix.api-level }}-${{ matrix.arch }}
          path: '**/build/reports/androidTests/'
