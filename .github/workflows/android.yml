name: Android CI

on:
  push:
    branches: [ "**" ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v5

      - name: Build and unit-test
        run: ./gradlew assembleDebug testDebugUnitTest --console=plain

      - uses: actions/upload-artifact@v5
        with:
          name: SkyPython-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

  instrumented:
    name: instrumented (API ${{ matrix.api-level }} ${{ matrix.arch }})
    runs-on: ubuntu-24.04
    strategy:
      # One failing Android version must not cancel the others.
      fail-fast: false
      matrix:
        # 24 = minSdk (Android 7.0), then Android 9, 11, 14 and 16.
        api-level: [24, 28, 30, 34, 36]
        arch: [x86_64]
        include:
          # 32-bit Python (our own CPython build) on a 32-bit x86 emulator.
          - api-level: 28
            arch: x86
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v5

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run instrumented tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: ${{ matrix.arch }}
          # google_apis x86_64 images exist for every level in the matrix.
          target: google_apis
          disable-animations: true
          script: ./gradlew connectedDebugAndroidTest --console=plain

      - name: Summarize instrumented tests
        if: always()
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          for f in glob.glob('**/build/outputs/androidTest-results/connected/**/*.xml', recursive=True):
              r = ET.parse(f).getroot()
              suites = [r] if r.tag == 'testsuite' else r.findall('testsuite')
              for s in suites:
                  print(f"::notice title=API ${{ matrix.api-level }} ${{ matrix.arch }} {s.get('name')}::tests={s.get('tests')} failures={s.get('failures')} errors={s.get('errors')} skipped={s.get('skipped')}")
                  for c in s.findall('testcase'):
                      if c.find('failure') is not None or c.find('error') is not None:
                          print(f"::error title=API ${{ matrix.api-level }} ${{ matrix.arch }} FAILED {c.get('classname')}.{c.get('name')}::failed")
          PY

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: instrumented-test-reports-api${{ matrix.api-level }}-${{ matrix.arch }}
          path: '**/build/reports/androidTests/'
