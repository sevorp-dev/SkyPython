org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Android ABIs packed into the APK (comma-separated); :runtime builds CPython for the same list.
# 32-bit ABIs (armeabi-v7a, x86) need the build-python workflow to have run once and its
# hashes pinned in runtime/python.properties.
# The release workflow overrides it per build (-Pskypython.abis=arm64-v8a) for per-ABI APKs.
skypython.abis=arm64-v8a,x86_64
# true = run instrumented tests (connectedAndroidTest) against the minified release build.
skypython.testRelease=false
