org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# Android ABIs to build and ship CPython for (comma-separated). 32-bit ABIs
# (armeabi-v7a, x86) need the build-python workflow to have run once and its
# hashes pinned in runtime/python.properties.
skypython.abis=arm64-v8a,x86_64
